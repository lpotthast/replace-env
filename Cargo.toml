[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
replace-env = { path = "./crates/replace-env", version = "0.1.0" }
derive-replace-env = { path = "./crates/derive-replace-env", version = "0.1.0" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
